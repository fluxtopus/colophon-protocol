[project]
name = "colophon-header-survival"
version = "0"
description = "Harness for the header-survival test of Colophon v0 (spec section 15, issue 1)."
requires-python = ">=3.10"
dependencies = [
    "cryptography>=42",
    "boto3>=1.34",
    "dnspython>=2.6",
    "msal>=1.28",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
