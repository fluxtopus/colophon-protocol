# Builds colophon-protocol.org from this repository and publishes it with GitHub Pages.
# The site is generated from README.md and colophon-v0.md; it is not deployed
# unless the test vectors still reproduce.
name: Site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          cache-dependency-glob: site/build.py
      - name: Run the test vectors
        run: uv run --with cryptography python reference/colophon_v0.py
      - name: Check vectors.json reproduces
        run: uv run --with cryptography python reference/colophon_v0.py --json | cmp - reference/vectors.json
      - name: Test the header-survival harness
        run: uv run --directory tests/header-survival pytest -q
      - name: Build the site
        run: uv run site/build.py
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
