# Runs the reference sketch and the Python library against the same test vectors, through the
# language-neutral conformance runner, and runs the library's own tests and checks.
name: Implementations

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: implementations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sketch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - name: Run the test vectors
        run: uv run --no-project --with cryptography python reference/colophon_v0.py
      - name: Check vectors.json reproduces
        run: uv run --no-project --with cryptography python reference/colophon_v0.py --json | cmp - reference/vectors.json
      - name: Conformance, reference sketch
        run: >-
          python3 conformance/run.py --quiet --
          uv run --no-project --with cryptography python conformance/adapters/sketch.py

  python:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    defaults:
      run:
        working-directory: python
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          cache-dependency-glob: python/uv.lock
      - name: Install
        run: uv sync --locked
      - name: Conformance, Python library
        run: uv run --locked python ../conformance/run.py --quiet -- uv run --locked python ../conformance/adapters/library.py
      - name: Tests
        run: uv run --locked pytest
      - name: Type check
        run: uv run --locked mypy
      - name: Type check the conformance runner and adapter
        run: uv run --locked mypy --strict ../conformance/run.py ../conformance/adapters/library.py
      - name: Lint
        run: |
          uv run --locked ruff check . ../conformance
          uv run --locked ruff format --check . ../conformance
      - name: Build the distributions
        run: uv build
