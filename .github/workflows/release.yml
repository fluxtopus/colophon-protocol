# Publishes the Python library to PyPI. Started by hand from main, with the version to publish.
# The pypi environment waits for the founder's approval, and PyPI trusts this workflow as a
# trusted publisher (OIDC), so no token is stored. The files get PyPI attestations.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, as in python/pyproject.toml (for example 0.1.0)"
        required: true
        type: string

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: python
    env:
      VERSION: ${{ inputs.version }}
      UV_PYTHON: "3.12"
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        working-directory: .
        run: |
          echo "Releases run from main only, not $GITHUB_REF." >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - name: Check the version matches the package and is not released yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "The version must be X.Y.Z, not '$VERSION'." >&2
            exit 1
          fi
          project=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          module=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/colophon_protocol/__init__.py)
          if [ "$project" != "$VERSION" ] || [ "$module" != "$VERSION" ]; then
            echo "pyproject.toml has $project and __init__.py has $module, not $VERSION." >&2
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/python-v$VERSION" >/dev/null 2>&1; then
            echo "The tag python-v$VERSION already exists." >&2
            exit 1
          fi
          status=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/colophon-protocol/$VERSION/json")
          if [ "$status" != "404" ]; then
            echo "PyPI already answers $status for colophon-protocol $VERSION." >&2
            exit 1
          fi
      - name: Install
        run: uv sync --locked
      - name: Conformance, Python library
        run: uv run --locked python ../conformance/run.py --quiet -- uv run --locked python ../conformance/adapters/library.py
      - name: Tests
        run: uv run --locked pytest
      - name: Type check
        run: uv run --locked mypy
      - name: Lint
        run: |
          uv run --locked ruff check . ../conformance
          uv run --locked ruff format --check . ../conformance
      - name: Build the distributions
        run: |
          rm -rf dist
          uv build
          ls dist
          test -f "dist/colophon_protocol-$VERSION.tar.gz"
          test -f "dist/colophon_protocol-$VERSION-py3-none-any.whl"
          test "$(ls dist | wc -l)" -eq 2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: python/dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/colophon-protocol/${{ inputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  tag:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Tag the released commit
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: >-
          gh api "repos/$GITHUB_REPOSITORY/git/refs"
          -f ref="refs/tags/python-v$VERSION" -f sha="$GITHUB_SHA"
