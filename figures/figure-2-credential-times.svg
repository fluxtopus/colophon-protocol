<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t2">
<title id="t2">Figure 2. One credential's times</title>
<style>
text{font:14px system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1d1d1f}
.b{font-weight:600}.m{fill:#5f6368}.s{font-size:12.5px}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:12px}
.box{fill:#f3f1ec;stroke:#cfc9bd}.grp{fill:none;stroke:#cfc9bd;stroke-dasharray:5 4}
.ln{fill:none;stroke:#6b6f75;stroke-width:1.4}.dash{stroke-dasharray:4 3}.ah{fill:#6b6f75}
.ok{fill:#e4efe0;stroke:#7fa676}.no{fill:#f6e6e1;stroke:#c48b7b}.acc{fill:#8a4b08}.rule{stroke:#e4e1da}
@media (prefers-color-scheme:dark){
text{fill:#e8e6e3}.m{fill:#a3a3a8}.box{fill:#1f1f23;stroke:#3d3d44}.grp{stroke:#4a4a52}
.ln{stroke:#9a9aa0}.ah{fill:#9a9aa0}.ok{fill:#1d2a1c;stroke:#4f7a48}.no{fill:#2e1f1c;stroke:#8a5a4e}
.acc{fill:#f0b878}.rule{stroke:#2f2f33}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 0L10 5L0 10z"/></marker></defs>
<text class="b" x="226" y="24" text-anchor="middle">iat</text>
<text class="b" x="658" y="24" text-anchor="middle">exp</text>
<text class="b" x="694" y="24" text-anchor="middle">+2 h</text>
<g class="m s" text-anchor="middle">
<text x="334" y="44">6 h</text><text x="442" y="44">12 h</text><text x="550" y="44">18 h</text>
</g>
<path class="ln" d="M226 54H694M226 50v8M334 50v8M442 50v8M550 50v8M658 50v8M694 50v8"/>
<path class="ln dash" d="M226 58V258M658 58V258M694 58V258"/>

<text class="b" x="20" y="84">Credential is valid</text>
<text class="m s" x="20" y="102">exp − iat is at most 24 h</text>
<rect class="acc" x="226" y="78" width="432" height="16" rx="3"/>

<text class="b" x="20" y="134">Signer uses it</text>
<text class="m s" x="20" y="152">SHOULD keep 6 h in hand</text>
<rect class="acc" x="226" y="128" width="324" height="16" rx="3"/>
<rect class="acc" x="550" y="128" width="108" height="16" rx="3" opacity=".25"/>
<text class="m s" x="604" y="164" text-anchor="middle">under 6 h left</text>

<text class="b" x="20" y="184">Message may arrive</text>
<text class="m s" x="20" y="202">iat − 5 min to exp + 2 h</text>
<rect class="acc" x="226" y="178" width="432" height="16" rx="3"/>
<rect class="acc" x="658" y="178" width="36" height="16" rx="3" opacity=".55"/>

<text class="b" x="20" y="234">Replay record kept</text>
<text class="m s" x="20" y="252">from verifying to exp + 2 h</text>
<rect class="acc" x="388" y="228" width="306" height="16" rx="3" opacity=".55"/>
<circle class="acc" cx="388" cy="236" r="6"/>
<text class="m s" x="376" y="241" text-anchor="end">verified</text>

<path class="ln" d="M226 274v8H694v-8"/>
<text class="s" x="460" y="304" text-anchor="middle">Revoke by not reissuing: the last credential's mail stops</text>
<text class="s" x="460" y="322" text-anchor="middle">verifying within 26 h.</text>
</svg>
